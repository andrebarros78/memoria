[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memoria-permanente"
version = "0.30.0"
description = "Infraestrutura universal soberana de memória, contexto, estado e continuidade"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "mcp>=2,<3",
  "fastembed==0.8.0",
  "cryptography>=50,<51",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
memory_permanent = ["static/*.html", "static/*.js", "static/*.css"]

[tool.setuptools.data-files]
"share/memoria-permanente/.wmcp" = [".wmcp/product-dna.json"]
"share/memoria-permanente/migrations" = ["migrations/*.sql"]

[tool.ruff]
target-version = "py312"
extend-exclude = [".agents/skills", "third_party"]

[tool.ruff.lint]
select = ["E4", "E9", "F", "I", "B", "BLE", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/memory_permanent/api.py" = ["B008", "BLE001"]
"src/memory_permanent/conversation_ingestion.py" = ["BLE001"]
