<!doctype html><html><head><meta charset="utf-8"><title>Memoria Permanente V4</title></head>
<body><h2>Memoria Permanente V4</h2>
<label><input id="enabled" type="checkbox"> Captura habilitada</label><br><br>
<label>API <input id="apiUrl" size="52"></label><br><br>
<label>Tenant <input id="tenant" size="20"></label><br><br>
<label>Client ID <input id="clientId" size="28" autocomplete="off"></label><br><br>
<label>Client secret <input id="clientSecret" type="password" size="52" autocomplete="new-password"></label><br>
<small>O segredo fica somente em chrome.storage.local deste perfil e nunca é embutido no código.</small><br><br>
<button id="save">Salvar</button><span id="status"></span>
<script src="options.js"></script></body></html>
